name: Publish Daybook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  # The server (database and server functions) is published from the inkwell
  # repository's supabase/ folder since Nov 2026; this workflow only publishes the app.
  site:
    name: Publish the app
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the site folder
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p _site
          cp -r index.html privacy.html app.css manifest.webmanifest sw.js favicon.ico icons js _site/
          printf "export default { supabaseUrl: '%s', supabaseAnonKey: '%s' };\n" "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > _site/js/config.js
          # New cache name on every publish so phones pick up the update.
          sed -i "s/daybook-v1/daybook-${GITHUB_SHA::8}/" _site/sw.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daybook</title>
<meta name="description" content="Projects, tasks and your calendar in one calm place.">
<meta name="theme-color" content="#1C1A17">
<meta name="color-scheme" content="dark light">
<script>try{if(JSON.parse(localStorage.getItem('daybook-look'))==='paper'){document.documentElement.dataset.look='paper';document.querySelector('meta[name="theme-color"]').content='#F6F1E7'}}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daybook">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
  <aside class="ai" id="ai" aria-label="Ask Claude">
    <div class="ai-h">
      <div class="ai-t"><i class="orb" aria-hidden="true"></i><div><b>Ask Claude</b><small>Plan your week, break down a task, or think something through.</small></div></div>
      <button class="ib" data-act="ai-toggle" aria-label="Close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
    <div class="msgs vscroll" id="msgs"></div>
    <div class="sugs" id="sugs"></div>
    <form class="askf" id="askf"><input id="askq" placeholder="Ask about your week or a project" autocomplete="off" enterkeyhint="send"><button type="submit">Send</button></form>
  </aside>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="detail" id="detail" hidden></div>
<div class="welcome" id="welcome" hidden>
  <div class="wl">
    <i class="orb big" aria-hidden="true"></i>
    <div class="brand">Daybook</div>
    <p>Your projects, tasks and Google Calendar in one calm place, on your phone and your computer.</p>
    <button class="g-btn" data-act="signin"><svg viewBox="0 0 18 18" aria-hidden="true"><path fill="#fff" d="M17.6 9.2c0-.6-.1-1.2-.2-1.8H9v3.4h4.8a4.1 4.1 0 0 1-1.8 2.7v2.2h2.9c1.7-1.6 2.7-3.9 2.7-6.5z"/><path fill="#fff" opacity=".8" d="M9 18c2.4 0 4.5-.8 6-2.2l-2.9-2.2c-.8.5-1.8.9-3.1.9-2.4 0-4.4-1.6-5.1-3.8H.9v2.3A9 9 0 0 0 9 18z"/><path fill="#fff" opacity=".6" d="M3.9 10.7a5.4 5.4 0 0 1 0-3.4V5H.9a9 9 0 0 0 0 8z"/><path fill="#fff" opacity=".9" d="M9 3.6c1.3 0 2.5.5 3.5 1.4l2.6-2.6A9 9 0 0 0 .9 5l3 2.3C4.6 5.2 6.6 3.6 9 3.6z"/></svg>Continue with Google</button>
    <small>Daybook reads your Google Calendar so tasks can fit around your events. It never changes your calendar.</small>
    <button class="link" data-act="demo">Look around with sample data first</button>
  </div>
</div>
<script src="js/vendor/supabase.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
